<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable icon -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  
  <!-- Subtle background glow -->
  <circle cx="256" cy="256" r="180" fill="#10b981" opacity="0.1" filter="blur(40px)" />

  <!-- Centered App Badge (Safe Zone inside 80% circle) -->
  <g transform="translate(66, 66)" filter="url(#shadow)">
    <rect width="380" height="380" rx="84" fill="url(#paperGrad)" />
    
    <!-- Folded top-right corner -->
    <path d="M290 0 L380 90 L290 90 Z" fill="#cbd5e1" />
    <path d="M290 0 L380 90 V0 Z" fill="#94a3b8" opacity="0.5" />

    <!-- Document lines -->
    <line x1="60" y1="140" x2="320" y2="140" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" />
    <line x1="60" y1="188" x2="320" y2="188" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" />
    <line x1="60" y1="236" x2="260" y2="236" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" />

    <!-- Signature text 'SignHim' -->
    <text 
      x="56" 
      y="225" 
      font-family="Georgia, 'Times New Roman', serif" 
      font-weight="bold" 
      font-style="italic" 
      font-size="78" 
      fill="#0f172a" 
      letter-spacing="-2"
    >
      SignHim
    </text>

    <!-- Signature underline flourish with emerald accent -->
    <path d="M60 270 C 140 250, 240 310, 340 270" stroke="#059669" stroke-width="10" stroke-linecap="round" fill="none" />
    <circle cx="340" cy="270" r="7" fill="#059669" />

    <!-- Moneyball Badge Star/Target icon -->
    <circle cx="310" cy="90" r="28" fill="#059669" />
    <path d="M310 74 L314 84 L324 88 L314 92 L310 102 L306 92 L296 88 L306 84 Z" fill="#ffffff" />
  </g>
</svg>
